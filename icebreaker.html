<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隨機破冰問題庫</title>
  <style>
    :root {
      --bg: #eef2f5;
      --card-bg: #ffffff;
      --primary: #5c6bc0;
      --accent: #ff7043;
      --text: #37474f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .top-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .back-btn { text-decoration: none; color: var(--primary); font-weight: bold; font-size: 0.95rem; }
    .card-box {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      text-align: center;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      margin-bottom: 20px;
      position: relative;
    }
    .tag {
      background: #e8eaf6;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .question {
      font-size: 1.25rem;
      line-height: 1.6;
      font-weight: 600;
      color: #263238;
      margin: 0;
    }
    .btn-group {
      width: 100%;
      max-width: 450px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .draw-btn { background: var(--primary); color: white; }
    .add-btn { background: #81c784; color: white; }
    .manage-btn { background: #b0bec5; color: white; flex: 0.6; }

    /* 管理面板 Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 100;
    }
    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 450px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-top: 0; color: var(--text); }
    .input-field {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .q-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← 回到工具箱</a>
    <span style="font-size:0.85rem; color:#78909c;" id="countText">共 0 張卡片</span>
  </div>

  <div class="card-box">
    <span class="tag" id="tagText">點擊下方按鈕開始</span>
    <p class="question" id="qText">準備好抽一張破冰卡片了嗎？</p>
  </div>

  <div class="btn-group">
    <button class="draw-btn" onclick="drawCard()">🎲 隨機抽卡</button>
    <button class="add-btn" onclick="openAddModal()">+ 新增</button>
    <button class="manage-btn" onclick="openManageModal()">⚙️ 管理</button>
  </div>

  <!-- 新增卡片 Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>新增破冰問題</h3>
      <input type="text" id="newCategory" class="input-field" placeholder="分類 (例如：輕鬆、深度、職場、趣味)">
      <textarea id="newQuestion" class="input-field" rows="3" placeholder="請輸入問題內容..."></textarea>
      <div style="display:flex; gap:10px;">
        <button class="draw-btn" onclick="saveNewCard()">儲存</button>
        <button style="background:#e0e0e0;" onclick="closeModal('addModal')">取消</button>
      </div>
    </div>
  </div>

  <!-- 管理與備份 Modal -->
  <div class="modal" id="manageModal">
    <div class="modal-content">
      <h3>卡片管理與清單</h3>
      <div style="margin-bottom:15px; display:flex; gap:5px;">
        <button style="background:#4db6ac; color:white; font-size:0.8rem; padding:8px;" onclick="exportData()">導出 JSON</button>
        <button style="background:#ffb74d; color:white; font-size:0.8rem; padding:8px;" onclick="importData()">匯入 JSON</button>
        <button style="background:#e57373; color:white; font-size:0.8rem; padding:8px;" onclick="resetDefault()">重置預設</button>
      </div>
      <div id="qList"></div>
      <button style="background:#e0e0e0; margin-top:15px; width:100%;" onclick="closeModal('manageModal')">關閉</button>
    </div>
  </div>

<script>
  // 預設卡片庫
  const defaultCards = [
    { cat: "輕鬆", q: "如果你可以瞬間學會一項技能，你希望是什麼？" },
    { cat: "趣味", q: "你吃過最奇怪但意想不到好吃的食物是什麼？" },
    { cat: "深度", q: "當你覺得焦慮或壓力大時，最能讓你安心的放鬆方式是什麼？" },
    { cat: "職場", q: "你最喜歡的工作環境或氛圍具備什麼要素？" },
    { cat: "生活", q: "如果明天突然多出一整天的假，且不能用手機，你會想做什麼？" },
    { cat: "音樂", q: "有沒有哪一首歌，是你心情不好時聽一定能被療癒的？" },
    { cat: "秩序", q: "你生活中有沒有什麼不可妥協的「小堅持」或「儀式感」？" }
  ];

  function getCards() {
    const data = localStorage.getItem('icebreaker_cards');
    return data ? JSON.parse(data) : defaultCards;
  }

  function saveCards(cards) {
    localStorage.setItem('icebreaker_cards', JSON.stringify(cards));
    updateCount();
  }

  function updateCount() {
    const cards = getCards();
    document.getElementById('countText').innerText = `共 ${cards.length} 張卡片`;
  }

  function drawCard() {
    const cards = getCards();
    if (cards.length === 0) {
      document.getElementById('tagText').innerText = "提示";
      document.getElementById('qText').innerText = "目前沒有任何卡片，請先點擊「新增」！";
      return;
    }
    const randomIndex = Math.floor(Math.random() * cards.length);
    const card = cards[randomIndex];
    document.getElementById('tagText').innerText = card.cat || "破冰問題";
    document.getElementById('qText').innerText = card.q;
  }

  function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
  function openManageModal() { renderManageList(); document.getElementById('manageModal').style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function saveNewCard() {
    const cat = document.getElementById('newCategory').value.trim() || "常規";
    const q = document.getElementById('newQuestion').value.trim();
    if (!q) { alert("請輸入問題內容！"); return; }
    
    const cards = getCards();
    cards.push({ cat, q });
    saveCards(cards);

    document.getElementById('newCategory').value = '';
    document.getElementById('newQuestion').value = '';
    closeModal('addModal');
    drawCard();
  }

  function renderManageList() {
    const cards = getCards();
    const list = document.getElementById('qList');
    list.innerHTML = cards.map((c, i) => `
      <div class="q-item">
        <span><b>[${c.cat}]</b> ${c.q}</span>
        <button style="background:none; border:none; color:#e57373; cursor:pointer;" onclick="deleteCard(${i})">刪除</button>
      </div>
    `).join('');
  }

  function deleteCard(index) {
    const cards = getCards();
    cards.splice(index, 1);
    saveCards(cards);
    renderManageList();
  }

  function resetDefault() {
    if (confirm("確定要重置為預設的卡片庫嗎？")) {
      saveCards(defaultCards);
      renderManageList();
      drawCard();
    }
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getCards(), null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "icebreaker_cards.json");
    dlAnchorElem.click();
  }

  function importData() {
    const jsonStr = prompt("請貼入破冰問題的 JSON 字串：");
    if (!jsonStr) return;
    try {
      const cards = JSON.parse(jsonStr);
      if (Array.isArray(cards)) {
        saveCards(cards);
        renderManageList();
        drawCard();
        alert("匯入成功！");
      }
    } catch(e) {
      alert("JSON 格式錯誤！");
    }
  }

  // 初始化
  updateCount();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>互動幾何軌跡探索器</title>
  <style>
    :root {
      --bg: #121218;
      --card-bg: #1e1e2a;
      --primary: #7c4dff;
      --accent: #00e676;
      --warn: #ff5252;
      --text: #e0e0e0;
      --subtext: #9e9e9e;
    }
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .back-btn {
      text-decoration: none;
      color: var(--primary);
      font-weight: bold;
      font-size: 0.85rem;
      background: rgba(124, 77, 255, 0.15);
      padding: 5px 10px;
      border-radius: 6px;
    }
    .title { font-size: 1rem; font-weight: bold; color: #fff; }

    .canvas-card {
      width: 100%;
      max-width: 500px;
      background: #0a0a0f;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    canvas {
      width: 100%;
      height: 350px;
      display: block;
      cursor: crosshair;
    }
    .status-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #b0bec5;
      pointer-events: none;
      line-height: 1.35;
    }
    .fit-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .fit-yes { background: rgba(0, 230, 118, 0.25); color: var(--accent); }
    .fit-no { background: rgba(255, 82, 82, 0.25); color: var(--warn); }

    .controls-card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }
    .mode-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--subtext);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .form-group { margin-bottom: 8px; }
    label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--subtext); margin-bottom: 3px; }
    select, input[type="range"] {
      width: 100%;
      background: #12121a;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    input[type="range"] { height: 4px; accent-color: var(--primary); }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    button.act-btn {
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      color: #fff;
    }
    .btn-clear { background: #ff5252; }
    .btn-reset { background: #00b0ff; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← 回到工具箱</a>
    <span class="title">✨ 互動幾何軌跡探索器</span>
  </div>

  <div class="canvas-card">
    <canvas id="canvas"></canvas>
    <div class="status-overlay" id="statusBox">載入中...</div>
  </div>

  <div class="controls-card">
    <div class="mode-selector">
      <button class="mode-btn active" id="btnExplore" onclick="setMode('explore')">🔍 探索模式 (用家拖動點 P)</button>
      <button class="mode-btn" id="btnAnim" onclick="setMode('anim')">🎬 動畫模式 (自動軌跡)</button>
    </div>

    <div class="form-group">
      <label for="caseSelect">軌跡條件 Case：</label>
      <select id="caseSelect" onchange="changeCase()">
        <option value="1">Case 1: PA = PB (垂直平分線)</option>
        <option value="2">Case 2: PA = k · PB (阿波羅尼斯圓)</option>
        <option value="3">Case 3: 到無限直線 L 距離 = d (雙側平行線)</option>
        <option value="4">Case 4: 到有限線段 AB 距離 = d (藥丸形/Capsule)</option>
        <option value="5">Case 5: 到焦點 F 距離 = 到準線 L 距離 (拋物線)</option>
      </select>
    </div>

    <div id="sliderBox"></div>

    <div class="action-grid">
      <button class="act-btn btn-clear" onclick="clearTraces()">🧹 清除探索痕跡</button>
      <button class="act-btn btn-reset" onclick="resetPositions()">🔄 重置點的位置</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusBox = document.getElementById('statusBox');
  const sliderBox = document.getElementById('sliderBox');

  let mode = 'explore';
  let currentCase = '1';
  let t = 0;

  let userTraces = [];
  let animTraces = [];

  let points = {
    A: { x: -70, y: 0 },
    B: { x: 70, y: 0 },
    F: { x: 0, y: -45 },
    L1: { x: -120, y: 40 },
    L2: { x: 120, y: 40 },
    P: { x: 0, y: -20 }
  };

  let params = {
    k: 1.5,
    d: 40
  };

  let draggedPoint = null;
  const HIT_RADIUS = 24;

  function setMode(m) {
    mode = m;
    document.getElementById('btnExplore').classList.toggle('active', mode === 'explore');
    document.getElementById('btnAnim').classList.toggle('active', mode === 'anim');
    clearTraces();
  }

  function changeCase() {
    currentCase = document.getElementById('caseSelect').value;
    renderSliders();
    clearTraces();
    resetPositions();
  }

  function clearTraces() {
    userTraces = [];
    animTraces = [];
  }

  function resetPositions() {
    points.A = { x: -80, y: 0 };
    points.B = { x: 80, y: 0 };
    points.F = { x: 0, y: -50 };
    points.L1 = { x: -120, y: 30 };
    points.L2 = { x: 120, y: 30 };
    points.P = { x: 10, y: -20 };
  }

  function renderSliders() {
    let html = '';
    if (currentCase === '2') {
      html = `<div class="form-group"><label>比例常數 k (PA / PB): <span id="valK">${params.k}</span></label><input type="range" min="0.3" max="2.5" step="0.1" value="${params.k}" oninput="params.k=+this.value; valK.innerText=this.value; clearTraces();"></div>`;
    } else if (currentCase === '3' || currentCase === '4') {
      html = `<div class="form-group"><label>固定距離 d: <span id="valD">${params.d}</span> px</label><input type="range" min="15" max="80" value="${params.d}" oninput="params.d=+this.value; valD.innerText=this.value; clearTraces();"></div>`;
    }
    sliderBox.innerHTML = html;
  }

  function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

  function distToLine(P, L1, L2) {
    const A = L2.y - L1.y;
    const B = L1.x - L2.x;
    const C = L2.x * L1.y - L1.x * L2.y;
    const len = Math.hypot(A, B);
    return len === 0 ? dist(P, L1) : Math.abs(A * P.x + B * P.y + C) / len;
  }

  function distToSegment(P, A, B) {
    const l2 = Math.pow(A.x - B.x, 2) + Math.pow(A.y - B.y, 2);
    if (l2 === 0) return dist(P, A);
    let t = ((P.x - A.x) * (B.x - A.x) + (P.y - A.y) * (B.y - A.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    const proj = { x: A.x + t * (B.x - A.x), y: A.y + t * (B.y - A.y) };
    return dist(P, proj);
  }

  function checkCondition(P) {
    let diff = 0;
    let targetText = '';
    const tolerance = 4.5;

    if (currentCase === '1') {
      const dPA = dist(P, points.A);
      const dPB = dist(P, points.B);
      diff = Math.abs(dPA - dPB);
      targetText = `PA = ${dPA.toFixed(1)}, PB = ${dPB.toFixed(1)}`;
    } else if (currentCase === '2') {
      const dPA = dist(P, points.A);
      const dPB = dist(P, points.B);
      diff = Math.abs(dPA - params.k * dPB);
      targetText = `PA = ${dPA.toFixed(1)}, k·PB = ${(params.k * dPB).toFixed(1)}`;
    } else if (currentCase === '3') {
      const dLine = distToLine(P, points.L1, points.L2);
      diff = Math.abs(dLine - params.d);
      targetText = `到直線距離 = ${dLine.toFixed(1)} (目標 d = ${params.d})`;
    } else if (currentCase === '4') {
      const dSeg = distToSegment(P, points.A, points.B);
      diff = Math.abs(dSeg - params.d);
      targetText = `到線段距離 = ${dSeg.toFixed(1)} (目標 d = ${params.d})`;
    } else if (currentCase === '5') {
      const dF = dist(P, points.F);
      const dL = distToLine(P, points.L1, points.L2);
      diff = Math.abs(dF - dL);
      targetText = `PF = ${dF.toFixed(1)}, 到準線 = ${dL.toFixed(1)}`;
    }

    return { isValid: diff <= tolerance, diff, targetText };
  }

  function draw() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    const cx = w / 2;
    const cy = h / 2;

    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 25) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for (let y = 0; y < h; y += 25) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

    ctx.save();
    ctx.translate(cx, cy);

    drawBaseGeometry();

    if (mode === 'anim') {
      updateAnimation();
    } else {
      const cond = checkCondition(points.P);
      if (cond.isValid) {
        const last = userTraces[userTraces.length - 1];
        if (!last || dist(last, points.P) > 3.5) {
          userTraces.push({ x: points.P.x, y: points.P.y });
        }
      }
      statusBox.innerHTML = `
        <b>🔍 自由探索模式</b>：請用手指/滑鼠拖動點 P。<br>
        狀態：${cond.targetText} 
        <span class="fit-badge ${cond.isValid ? 'fit-yes' : 'fit-no'}">
          ${cond.isValid ? '✨ 符合條件！已留下痕跡' : '❌ 未符合條件'}
        </span>
      `;
    }

    // 繪製探索痕跡
    ctx.fillStyle = "#00e676";
    for (let p of userTraces) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
    }

    // 繪製動畫模式軌跡 (加入跳轉防斷線保護)
    drawAnimTraces();

    drawPointP();

    ctx.restore();

    t += 0.025;
    requestAnimationFrame(draw);
  }

  function drawAnimTraces() {
    if (mode !== 'anim' || animTraces.length < 2) return;
    ctx.strokeStyle = "#7c4dff";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(animTraces[0].x, animTraces[0].y);

    for (let i = 1; i < animTraces.length; i++) {
      const p1 = animTraces[i - 1];
      const p2 = animTraces[i];
      // 突變距離大於 25 像素時，自動斷開重新開路徑，防止畫出跳躍斜線/方塊
      if (dist(p1, p2) > 25) {
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
      } else {
        ctx.lineTo(p2.x, p2.y);
      }
    }
    ctx.stroke();
  }

  function drawBaseGeometry() {
    if (currentCase === '1' || currentCase === '2') {
      ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.moveTo(points.A.x, points.A.y); ctx.lineTo(points.B.x, points.B.y); ctx.stroke();
      drawControlPoint(points.A, "A", "#ff5252");
      drawControlPoint(points.B, "B", "#00b0ff");
    } else if (currentCase === '3') {
      ctx.strokeStyle = "#ffb74d"; ctx.lineWidth = 2;
      const dx = points.L2.x - points.L1.x, dy = points.L2.y - points.L1.y;
      ctx.beginPath();
      ctx.moveTo(points.L1.x - dx*5, points.L1.y - dy*5);
      ctx.lineTo(points.L2.x + dx*5, points.L2.y + dy*5);
      ctx.stroke();
      drawControlPoint(points.L1, "L1", "#ffb74d");
      drawControlPoint(points.L2, "L2", "#ffb74d");
    } else if (currentCase === '4') {
      ctx.strokeStyle = "#ffb74d"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(points.A.x, points.A.y); ctx.lineTo(points.B.x, points.B.y); ctx.stroke();
      drawControlPoint(points.A, "A", "#ffb74d");
      drawControlPoint(points.B, "B", "#ffb74d");
    } else if (currentCase === '5') {
      drawControlPoint(points.F, "焦點 F", "#ff5252");
      ctx.strokeStyle = "#42a5f5"; ctx.lineWidth = 2;
      const dx = points.L2.x - points.L1.x, dy = points.L2.y - points.L1.y;
      ctx.beginPath();
      ctx.moveTo(points.L1.x - dx*5, points.L1.y - dy*5);
      ctx.lineTo(points.L2.x + dx*5, points.L2.y + dy*5);
      ctx.stroke();
      drawControlPoint(points.L1, "準線 L1", "#42a5f5");
      drawControlPoint(points.L2, "準線 L2", "#42a5f5");
    }
  }

  function drawPointP() {
    const P = points.P;
    const cond = checkCondition(P);

    ctx.strokeStyle = cond.isValid ? "rgba(0, 230, 118, 0.4)" : "rgba(255, 255, 255, 0.15)";
    ctx.lineWidth = 1;

    if (currentCase === '1' || currentCase === '2') {
      ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(points.A.x, points.A.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(points.B.x, points.B.y); ctx.stroke();
    } else if (currentCase === '5') {
      ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(points.F.x, points.F.y); ctx.stroke();
    }

    ctx.fillStyle = cond.isValid ? "#00e676" : "#ffeb3b";
    ctx.beginPath(); ctx.arc(P.x, P.y, cond.isValid ? 7 : 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.fillText("P", P.x + 8, P.y - 8);
  }

  function drawControlPoint(pt, label, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.fillText(label, pt.x - 10, pt.y - 9);
  }

  function updateAnimation() {
    statusBox.innerHTML = `<b>🎬 自動動畫展示模式</b>：系統正精確為你描繪數學軌跡...`;

    if (currentCase === '1') {
      const midX = (points.A.x + points.B.x)/2;
      const midY = (points.A.y + points.B.y)/2;
      const dx = points.B.x - points.A.x, dy = points.B.y - points.A.y;
      const param = Math.sin(t) * 130;
      points.P.x = midX - dy * (param/100);
      points.P.y = midY + dx * (param/100);
    } else if (currentCase === '2') {
      const k = params.k;
      const k2 = k * k;
      if (Math.abs(k - 1) < 0.05) {
        points.P.x = (points.A.x + points.B.x)/2;
        points.P.y = (points.A.y + points.B.y)/2 + Math.sin(t)*120;
      } else {
        const cx = (points.A.x - k2 * points.B.x) / (1 - k2);
        const cy = (points.A.y - k2 * points.B.y) / (1 - k2);
        const dAB = dist(points.A, points.B);
        const r = (k * dAB) / Math.abs(1 - k2);
        points.P.x = cx + r * Math.cos(t);
        points.P.y = cy + r * Math.sin(t);
      }
    } else if (currentCase === '3') {
      const dx = points.L2.x - points.L1.x, dy = points.L2.y - points.L1.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      // 在上平行線與下平行線平滑往復滑動
      const side = Math.floor(t / (Math.PI * 2)) % 2 === 0 ? 1 : -1;
      const pos = Math.sin(t) * 160;
      points.P.x = (points.L1.x + points.L2.x)/2 + (dx/len)*pos + nx * params.d * side;
      points.P.y = (points.L1.y + points.L2.y)/2 + (dy/len)*pos + ny * params.d * side;
    } else if (currentCase === '4') {
      const dx = points.B.x - points.A.x, dy = points.B.y - points.A.y;
      const segLen = Math.hypot(dx, dy) || 1;
      const nx = -dy / segLen, ny = dx / segLen;
      const baseAngle = Math.atan2(dy, dx);
      const r = params.d;

      const totalPerimeter = segLen * 2 + 2 * Math.PI * r;
      const curr = ((t * 45) % totalPerimeter + totalPerimeter) % totalPerimeter;

      if (curr < segLen) {
        points.P.x = points.A.x + (dx/segLen)*curr + nx * r;
        points.P.y = points.A.y + (dy/segLen)*curr + ny * r;
      } else if (curr < segLen + Math.PI * r) {
        const arcT = (curr - segLen) / r - Math.PI/2;
        points.P.x = points.B.x + r * Math.cos(baseAngle + arcT);
        points.P.y = points.B.y + r * Math.sin(baseAngle + arcT);
      } else if (curr < segLen * 2 + Math.PI * r) {
        const backT = curr - (segLen + Math.PI * r);
        points.P.x = points.B.x - (dx/segLen)*backT - nx * r;
        points.P.y = points.B.y - (dy/segLen)*backT - ny * r;
      } else {
        const arcT = (curr - (segLen * 2 + Math.PI * r)) / r + Math.PI/2;
        points.P.x = points.A.x + r * Math.cos(baseAngle + arcT);
        points.P.y = points.A.y + r * Math.sin(baseAngle + arcT);
      }
    } else if (currentCase === '5') {
      const F = points.F, L1 = points.L1, L2 = points.L2;
      const dx = L2.x - L1.x, dy = L2.y - L1.y;
      const len = Math.hypot(dx, dy) || 1;
      const u = { x: dx / len, y: dy / len };
      
      const projVal = (F.x - L1.x) * u.x + (F.y - L1.y) * u.y;
      const F0 = { x: L1.x + projVal * u.x, y: L1.y + projVal * u.y };
      const p = dist(F, F0) || 1;
      
      let v = { x: (F.x - F0.x) / p, y: (F.y - F0.y) / p };
      if (p === 0) v = { x: -u.y, y: u.x };

      const tx = Math.sin(t) * 150;
      const yVal = (tx * tx + p * p) / (2 * p);

      points.P.x = F0.x + tx * u.x + yVal * v.x;
      points.P.y = F0.y + tx * u.y + yVal * v.y;
    }

    animTraces.push({ x: points.P.x, y: points.P.y });
    if (animTraces.length > 450) animTraces.shift();
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left - canvas.clientWidth / 2,
      y: clientY - rect.top - canvas.clientHeight / 2
    };
  }

  function onPointerDown(e) {
    const pos = getCanvasPos(e);
    const checkList = [points.P, points.A, points.B, points.F, points.L1, points.L2];
    for (let pt of checkList) {
      if (pt && dist(pos, pt) < HIT_RADIUS) {
        draggedPoint = pt;
        if (mode === 'anim') setMode('explore');
        break;
      }
    }
  }

  function onPointerMove(e) {
    if (!draggedPoint) return;
    const pos = getCanvasPos(e);
    draggedPoint.x = pos.x;
    draggedPoint.y = pos.y;
  }

  function onPointerUp() { draggedPoint = null; }

  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  canvas.addEventListener('touchstart', onPointerDown);
  canvas.addEventListener('touchmove', onPointerMove);
  window.addEventListener('touchend', onPointerUp);

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resizeCanvas);

  resizeCanvas();
  renderSliders();
  resetPositions();
  draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人工具箱 - 首頁</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --primary: #4a6fa5;
      --text: #2c3e50;
      --subtext: #7f8c8d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
      margin-top: 10px;
    }
    .header h1 { margin: 0; font-size: 1.6rem; color: var(--primary); }
    .header p { margin: 5px 0 0; color: var(--subtext); font-size: 0.9rem; }
    
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(0,0,0,0.03);
    }
    .app-card:active { transform: scale(0.98); }
    .icon {
      font-size: 2.2rem;
      width: 55px;
      height: 55px;
      background: #eef3f9;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .info h2 { margin: 0; font-size: 1.15rem; color: var(--text); }
    .info p { margin: 4px 0 0; font-size: 0.85rem; color: var(--subtext); }

    .custom-links {
      margin-top: 25px;
      width: 100%;
      max-width: 480px;
    }
    .custom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .custom-header h3 { margin: 0; font-size: 1rem; color: var(--text); }
    .add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .custom-item {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .custom-item a { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .del-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌱 個人智慧工具箱</h1>
    <p>獨立運行．隱私安全．資料本機儲存</p>
  </div>

  <div class="container">
    <!-- 連結 1：日常任務 -->
    <a href="tasks.html" class="app-card">
      <div class="icon">🎯</div>
      <div class="info">
        <h2>日常任務與獎勵</h2>
        <p>低啟動能量微任務，秩序與抽卡放鬆系統</p>
      </div>
    </a>

    <!-- 連結 2：破冰問題庫 -->
    <a href="icebreaker.html" class="app-card">
      <div class="icon">🧊</div>
      <div class="info">
        <h2>隨機破冰問題庫</h2>
        <p>隨時抽取破冰話題、新增與管理話題卡片</p>
      </div>
    </a>
  </div>

  <!-- 補充功能：自訂常用連結目錄 -->
  <div class="custom-links">
    <div class="custom-header">
      <h3>🔗 自訂快捷目錄</h3>
      <button class="add-btn" onclick="addCustomLink()">+ 新增連結</button>
    </div>
    <div class="link-list" id="linkList"></div>
  </div>

<script>
  function renderLinks() {
    const links = JSON.parse(localStorage.getItem('portal_custom_links') || '[]');
    const list = document.getElementById('linkList');
    if (links.length === 0) {
      list.innerHTML = '<div style="color:#95a5a6; font-size:0.85rem; text-align:center; padding:10px;">尚未新增自訂連結</div>';
      return;
    }
    list.innerHTML = links.map((item, index) => `
      <div class="custom-item">
        <a href="${item.url}" target="_blank">${item.title}</a>
        <button class="del-btn" onclick="deleteLink(${index})">刪除</button>
      </div>
    `).join('');
  }

  function addCustomLink() {
    const title = prompt('請輸入連結名稱：');
    if (!title) return;
    let url = prompt('請輸入網址 (如 https://google.com)：');
    if (!url) return;
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
    }
    const links = JSON.parse(localStorage.getItem('portal_custom_links') || '[]');
    links.push({ title, url });
    localStorage.setItem('portal_custom_links', JSON.stringify(links));
    renderLinks();
  }

  function deleteLink(index) {
    const links = JSON.parse(localStorage.getItem('portal_custom_links') || '[]');
    links.splice(index, 1);
    localStorage.setItem('portal_custom_links', JSON.stringify(links));
    renderLinks();
  }

  renderLinks();
</script>
</body>
</html>

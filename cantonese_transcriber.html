<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣東話錄音分段轉錄器</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #3b5998;
      --primary-light: #eef2f7;
      --accent: #10b981;
      --warn: #f59e0b;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .back-btn {
      text-decoration: none;
      color: var(--primary);
      font-weight: bold;
      font-size: 0.95rem;
      background: var(--primary-light);
      padding: 6px 12px;
      border-radius: 8px;
    }
    .title { font-size: 1.1rem; font-weight: bold; }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .step-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 上傳與參數區 */
    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #f8fafc;
      transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: var(--primary); }
    input[type="file"] { display: none; }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.88rem;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
    }
    select, input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      background: #fff;
    }

    /* 分段 Project 選擇區 */
    .summary-banner {
      background: var(--primary-light);
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .proj-chip {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      background: #fff;
      text-align: left;
      transition: all 0.15s;
    }
    .proj-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }
    .proj-chip small { display: block; opacity: 0.85; font-size: 0.75rem; margin-top: 2px; }

    .time-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.85rem;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
    }
    .time-inputs input { width: 95px; text-align: center; font-family: monospace; }

    /* 進度表區 */
    .progress-group { margin-bottom: 12px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--subtext);
      margin-bottom: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }
    .progress-bar-fill.audio-fill { background: var(--accent); }

    /* 按鈕與輸出區 */
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    
    textarea {
      width: 100%;
      height: 220px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
      font-family: inherit;
      resize: vertical;
    }
    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-sec {
      flex: 1;
      padding: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← 回到工具箱</a>
    <span class="title">🎙️ 廣東話錄音分段轉錄器</span>
  </div>

  <!-- 步驟 1：上傳與單份運算基準設定 -->
  <div class="card">
    <div class="step-title">
      <span>1. 選擇錄音檔與單份運算上限</span>
      <span style="font-size:0.75rem; color:#64748b;">支援 MP3 / M4A / WAV</span>
    </div>

    <label class="upload-zone" for="audioFile">
      <div style="font-size:1.5rem; margin-bottom:4px;">📁</div>
      <div id="fileNameDisplay" style="font-weight:bold; color:#334155;">點擊選擇本地錄音檔案</div>
      <div style="font-size:0.78rem; color:#64748b; margin-top:4px;">檔案僅在本地瀏覽器讀取，不會上傳至雲端</div>
    </label>
    <input type="file" id="audioFile" accept="audio/*">

    <div class="setting-row">
      <span>每份最長時長（約需電腦運算 5 分鐘）：</span>
      <select id="chunkMinutes" onchange="recalculateProjects()">
        <option value="15">15 分鐘 / 份（低負載）</option>
        <option value="30" selected>30 分鐘 / 份（標準推薦）</option>
        <option value="45">45 分鐘 / 份（高效能電腦）</option>
      </select>
    </div>
  </div>

  <!-- 步驟 2：分段 Project 選擇器 (上傳後顯示) -->
  <div class="card" id="projectCard" style="display:none;">
    <div class="step-title">
      <span>2. 選擇要處理的分段 Project</span>
      <span id="totalDurationTag" style="font-size:0.8rem; color:#10b981;"></span>
    </div>

    <div class="summary-banner" id="splitSummary"></div>

    <!-- 自動生成的 1/N, 2/N 按鈕 -->
    <div class="project-grid" id="projectGrid"></div>

    <!-- 手動微調開始與結束時間 -->
    <div class="time-inputs">
      <span>區間微調：</span>
      <input type="text" id="startTimeInput" value="00:00:00" placeholder="HH:MM:SS">
      <span>至</span>
      <input type="text" id="endTimeInput" value="00:30:00" placeholder="HH:MM:SS">
    </div>
  </div>

  <!-- 步驟 3：即時雙層進度表 -->
  <div class="card" id="progressCard">
    <div class="step-title">
      <span>3. 系統運算進度監控</span>
      <span id="etaText" style="font-size:0.8rem; color:#3b5998;">待機中</span>
    </div>

    <!-- 進度條 A：模型下載/載入 -->
    <div class="progress-group">
      <div class="progress-label">
        <span id="modelStatusLabel">AI 廣東話模型狀態（首次使用需載入本機快取）</span>
        <span id="modelPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="modelBar"></div>
      </div>
    </div>

    <!-- 進度條 B：錄音片段轉錄進度 -->
    <div class="progress-group" style="margin-bottom:14px;">
      <div class="progress-label">
        <span id="audioStatusLabel">錄音片段轉錄進度</span>
        <span id="audioPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill audio-fill" id="audioBar"></div>
      </div>
    </div>

    <button class="btn-primary" id="startBtn" disabled onclick="startTranscription()">請先選擇錄音檔案</button>
  </div>

  <!-- 步驟 4：逐字稿結果輸出 -->
  <div class="card">
    <div class="step-title">
      <span>4. 廣東話逐字稿結果</span>
      <span id="activeProjLabel" style="font-size:0.8rem; color:#64748b;">尚未執行</span>
    </div>
    <textarea id="outputArea" placeholder="轉錄完成的廣東話文字會即時分段顯示於此..."></textarea>
    <div class="action-row">
      <button class="btn-sec" onclick="copyResult()">📋 複製文字</button>
      <button class="btn-sec" onclick="downloadTxt()">💾 下載 TXT 檔</button>
    </div>
  </div>

  <!-- 引入 Transformers.js 進行本機瀏覽器 AI 語音辨識 -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    // 允許從 Hugging Face Hub 下載模型並快取於瀏覽器 Cache
    env.allowLocalModels = false;

    let currentFile = null;
    let totalDurationSec = 0;
    let projects = [];
    let selectedProjIndex = 0;
    let transcriber = null;

    const audioFileInput = document.getElementById('audioFile');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const projectCard = document.getElementById('projectCard');
    const splitSummary = document.getElementById('splitSummary');
    const projectGrid = document.getElementById('projectGrid');
    const startTimeInput = document.getElementById('startTimeInput');
    const endTimeInput = document.getElementById('endTimeInput');
    const startBtn = document.getElementById('startBtn');
    const outputArea = document.getElementById('outputArea');

    // 格式化秒數為 HH:MM:SS
    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    // 解析 HH:MM:SS 或 MM:SS 為秒數
    function parseTime(str) {
      const parts = str.trim().split(':').map(Number);
      if (parts.some(isNaN)) return 0;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 0;
    }

    // 1. 監聽檔案選擇並快速讀取總時長
    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      currentFile = file;
      fileNameDisplay.innerText = `已載入：${file.name}`;

      // 利用 HTML5 Audio 元素無需完整解碼即可瞬間取得音檔時長
      const tempAudio = document.createElement('audio');
      tempAudio.preload = 'metadata';
      tempAudio.onloadedmetadata = () => {
        URL.revokeObjectURL(tempAudio.src);
        totalDurationSec = tempAudio.duration;
        projectCard.style.display = 'block';
        recalculateProjects();
        startBtn.disabled = false;
        startBtn.innerText = `▶ 開始轉錄所選片段 (${projects[0].label})`;
      };
      tempAudio.src = URL.createObjectURL(file);
    });

    // 2. 計算建議斬開幾多份 (Projects)
    window.recalculateProjects = function() {
      if (!totalDurationSec) return;
      const chunkMin = parseInt(document.getElementById('chunkMinutes').value, 10);
      const chunkSec = chunkMin * 60;

      const fullParts = Math.floor(totalDurationSec / chunkSec);
      const remainderSec = totalDurationSec % chunkSec;
      const totalParts = remainderSec > 1 ? fullParts + 1 : Math.max(1, fullParts);

      document.getElementById('totalDurationTag').innerText = `總時長：${formatTime(totalDurationSec)}`;

      // 顯示計算說明
      let desc = `錄音總長 <b>${(totalDurationSec / 60).toFixed(1)} 分鐘</b>。`;
      if (remainderSec > 1 && fullParts > 0) {
        desc += `以每份上限 ${chunkMin} 分鐘計算，建議斬開為 <b>${totalParts} 份</b>（${fullParts} 份完整 + 1 份尾段），每份預計需時約 3~5 分鐘運算：`;
      } else {
        desc += `以每份上限 ${chunkMin} 分鐘計算，建議分為 <b>${totalParts} 份</b> 進行處理：`;
      }
      splitSummary.innerHTML = desc;

      // 建立 Project 列表
      projects = [];
      for (let i = 0; i < totalParts; i++) {
        const start = i * chunkSec;
        const end = Math.min((i + 1) * chunkSec, totalDurationSec);
        projects.push({
          index: i,
          label: `Project ${i + 1}/${totalParts}`,
          start,
          end
        });
      }

      renderProjectChips();
      selectProject(0);
    };

    function renderProjectChips() {
      projectGrid.innerHTML = projects.map((p, idx) => `
        <button type="button" class="proj-chip ${idx === selectedProjIndex ? 'active' : ''}" onclick="selectProject(${idx})">
          <strong>${p.label}</strong>
          <small>${formatTime(p.start)} - ${formatTime(p.end)}</small>
        </button>
      `).join('');
    }

    window.selectProject = function(idx) {
      selectedProjIndex = idx;
      const p = projects[idx];
      startTimeInput.value = formatTime(p.start);
      endTimeInput.value = formatTime(p.end);
      renderProjectChips();
      if (!startBtn.disabled) {
        startBtn.innerText = `▶ 開始轉錄 ${p.label} (${startTimeInput.value} - ${endTimeInput.value})`;
      }
    };

    // 3. 執行轉錄與更新雙層進度條
    window.startTranscription = async function() {
      if (!currentFile) return;

      const startSec = parseTime(startTimeInput.value);
      const endSec = Math.min(parseTime(endTimeInput.value), totalDurationSec);

      if (endSec <= startSec) {
        alert("結束時間必須大於開始時間！");
        return;
      }

      startBtn.disabled = true;
      const projName = projects[selectedProjIndex] ? projects[selectedProjIndex].label : "自訂區間";
      document.getElementById('activeProjLabel').innerText = `正在處理：${projName}`;
      outputArea.value = `【${projName} | ${formatTime(startSec)} - ${formatTime(endSec)}】\n正在準備音訊數據...\n\n`;

      try {
        // Step A: 載入 Whisper 模型 (附帶下載進度條回報)
        if (!transcriber) {
          document.getElementById('etaText').innerText = "正在載入 AI 模型...";
          transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-small', {
            progress_callback: (info) => {
              if (info.status === 'progress') {
                const pct = Math.round(info.progress || 0);
                document.getElementById('modelBar').style.width = `${pct}%`;
                document.getElementById('modelPercent').innerText = `${pct}%`;
                document.getElementById('modelStatusLabel').innerText = `下載模型權重中 (${info.file})...`;
              } else if (info.status === 'ready') {
                document.getElementById('modelBar').style.width = '100%';
                document.getElementById('modelPercent').innerText = '100%';
                document.getElementById('modelStatusLabel').innerText = 'AI 廣東話模型已就緒';
              }
            }
          });
        }

        // Step B: 解碼音檔並裁切指定開始與結束時間
        document.getElementById('etaText').innerText = "正在解碼與裁切音軌...";
        const arrayBuffer = await currentFile.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const fullAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const sampleRate = 16000;
        const startSample = Math.floor(startSec * sampleRate);
        const endSample = Math.floor(endSec * sampleRate);
        const channelData = fullAudioBuffer.getChannelData(0).slice(startSample, endSample);

        // Step C: 以每 30 秒為一個小步進進行辨識，讓進度條平滑推進並即時輸出文字
        const stepSec = 30;
        const stepSamples = stepSec * sampleRate;
        const totalSamples = channelData.length;
        const totalSteps = Math.ceil(totalSamples / stepSamples);

        outputArea.value = `【${projName} | ${formatTime(startSec)} - ${formatTime(endSec)}】\n`;
        const processStartTime = Date.now();

        for (let step = 0; step < totalSteps; step++) {
          const sliceStart = step * stepSamples;
          const sliceEnd = Math.min((step + 1) * stepSamples, totalSamples);
          const subAudio = channelData.slice(sliceStart, sliceEnd);

          // 執行該 30 秒片段的廣東話辨識
          const result = await transcriber(subAudio, {
            language: 'cantonese',
            task: 'transcribe'
          });

          const currentTimestamp = formatTime(startSec + step * stepSec);
          if (result && result.text) {
            outputArea.value += `[${currentTimestamp}] ${result.text.trim()}\n`;
            outputArea.scrollTop = outputArea.scrollHeight;
          }

          // 更新音軌處理進度表與預計剩餘時間 (ETA)
          const doneRatio = (step + 1) / totalSteps;
          const pct = Math.round(doneRatio * 100);
          document.getElementById('audioBar').style.width = `${pct}%`;
          document.getElementById('audioPercent').innerText = `${pct}%`;
          document.getElementById('audioStatusLabel').innerText = `已處理 ${step + 1} / ${totalSteps} 個區塊`;

          const elapsedSec = (Date.now() - processStartTime) / 1000;
          const estimatedTotalSec = elapsedSec / doneRatio;
          const remainingSec = Math.max(0, Math.round(estimatedTotalSec - elapsedSec));
          document.getElementById('etaText').innerText = `運算中... 預計剩餘 ${formatTime(remainingSec)}`;
        }

        document.getElementById('etaText').innerText = "✅ 轉錄完成！";
        document.getElementById('activeProjLabel').innerText = `已完成：${projName}`;

      } catch (err) {
        console.error(err);
        document.getElementById('etaText').innerText = "❌ 發生錯誤";
        alert("處理音檔時發生錯誤（可能是音檔過大導致瀏覽器記憶體不足，建議將「每份最長時長」調小為 15 分鐘再試）：\n" + err.message);
      } finally {
        startBtn.disabled = false;
      }
    };

    window.copyResult = function() {
      navigator.clipboard.writeText(outputArea.value).then(() => alert("已複製逐字稿！"));
    };

    window.downloadTxt = function() {
      const blob = new Blob([outputArea.value], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const projLabel = projects[selectedProjIndex] ? projects[selectedProjIndex].label.replace('/', '-') : 'transcript';
      a.download = `廣東話逐字稿_${projLabel}.txt`;
      a.click();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>微習慣抽卡系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 防止手機端放大與提升觸控體驗 */
    button, input, textarea { touch-action: manipulation; }
    /* iOS 滾動流暢化 */
    body { -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-20">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <h1 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
        <span>🎲</span> 10-15min 習慣抽卡
      </h1>
      <span class="text-xs text-slate-400 font-mono">Mobile v2</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <section id="view-draw" class="space-y-4">
      <button onclick="drawRandomCards()" class="w-full py-4 bg-indigo-600 active:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 transition-all text-lg flex items-center justify-center gap-2">
        <span>✨</span> 隨機抽取任務與獎勵
      </button>

      <div class="bg-white rounded-2xl border-2 border-indigo-100 p-5 shadow-sm space-y-3 relative overflow-hidden">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <span id="draw-task-cat" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">任務卡</span>
          <span class="text-[10px] text-slate-400">10-15 分鐘</span>
        </div>
        <h2 id="draw-task-title" class="text-xl font-bold text-slate-900 leading-snug">載入中...</h2>
        <p id="draw-task-desc" class="text-slate-600 text-sm leading-relaxed">點擊上方按鈕，即刻抽取微習慣任務。</p>
        <div id="draw-task-hint-box" class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100">
          <span class="text-xs font-bold text-indigo-700 block mb-0.5">💡 最小啟動提示：</span>
          <span id="draw-task-hint" class="text-xs text-indigo-900 leading-normal block"></span>
        </div>
      </div>

      <div class="bg-white rounded-2xl border-2 border-emerald-100 p-5 shadow-sm space-y-3 relative overflow-hidden">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <span id="draw-reward-cat" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">獎勵卡</span>
          <span class="text-[10px] text-slate-400">完成後兌現</span>
        </div>
        <h2 id="draw-reward-title" class="text-xl font-bold text-slate-900 leading-snug">載入中...</h2>
        <p id="draw-reward-desc" class="text-slate-600 text-sm leading-relaxed">完成任務後，享受你專屬的即時小確幸。</p>
        <div id="draw-reward-focus-box" class="bg-emerald-50/70 p-3 rounded-xl border border-emerald-100">
          <span class="text-xs font-bold text-emerald-700 block mb-0.5">🎁 體驗重點：</span>
          <span id="draw-reward-focus" class="text-xs text-emerald-900 leading-normal block"></span>
        </div>
      </div>
    </section>

    <section id="view-manage" class="hidden space-y-6">
      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-slate-900">📌 任務卡 (<span id="task-count">0</span>)</h2>
          <button onclick="addNewCard('tasks')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-medium active:scale-95 transition-all">+ 新增</button>
        </div>
        <div id="tasks-grid" class="space-y-3"></div>
      </div>

      <hr class="border-slate-200">

      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-slate-900">🎁 獎勵卡 (<span id="reward-count">0</span>)</h2>
          <button onclick="addNewCard('rewards')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-medium active:scale-95 transition-all">+ 新增</button>
        </div>
        <div id="rewards-grid" class="space-y-3"></div>
      </div>
    </section>

    <section id="view-port" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
        <h3 class="text-sm font-bold text-slate-900">匯出資料 (Export)</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="exportJSON()" class="w-full py-2 bg-slate-800 text-white rounded-lg text-xs font-medium active:bg-slate-900">複製 JSON</button>
          <button onclick="exportMarkdown()" class="w-full py-2 bg-slate-100 text-slate-700 rounded-lg text-xs font-medium active:bg-slate-200">複製 Markdown</button>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
        <h3 class="text-sm font-bold text-slate-900">匯入資料 (Import)</h3>
        <textarea id="import-textarea" rows="4" placeholder="請貼上 JSON 格式卡片資料..." class="w-full p-2.5 border border-slate-300 rounded-lg text-base sm:text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <div class="flex gap-2">
          <button onclick="importJSON()" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-xs font-medium active:bg-indigo-700">確定匯入</button>
          <button onclick="resetDefaultData()" class="px-3 py-2 bg-rose-50 text-rose-600 rounded-lg text-xs font-medium active:bg-rose-100">重置預設</button>
        </div>
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around z-50">
    <button id="tab-draw-btn" onclick="switchTab('draw')" class="flex flex-col items-center gap-1 text-indigo-600">
      <span class="text-lg">🎲</span>
      <span class="text-[11px] font-bold">隨機抽卡</span>
    </button>
    <button id="tab-manage-btn" onclick="switchTab('manage')" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">✏️</span>
      <span class="text-[11px] font-bold">卡片管理</span>
    </button>
    <button id="tab-port-btn" onclick="switchTab('port')" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">⇄</span>
      <span class="text-[11px] font-bold">匯入/匯出</span>
    </button>
  </nav>

  <script>
    const defaultData = {
      tasks: [
        { id: 'T01', category: '家居角落', title: '床頭櫃專屬重置', desc: '清空床頭櫃頂面，拿掉不屬於該處的物品，用微濕抹布完整擦拭一遍。', hint: '先拿走第一件垃圾或空杯。' },
        { id: 'T02', category: '家居角落', title: '單一抽屜斷捨離', desc: '隨機拉開一個混亂的抽屜，分類清理廢紙與無用雜物，僅歸位有用物品。', hint: '只處理抽屜最前面那一小區。' },
        { id: 'T03', category: '家居角落', title: '水槽/鏡面耀眼計劃', desc: '使用專用布將浴室鏡面或廚房水槽擦拭至無水痕、泛起光澤。', hint: '拿起抹布沾水即刻開始。' },
        { id: 'T04', category: '數位清理', title: '相簿與桌面大掃除', desc: '刪除手機 20 張無用截圖，或清空電腦「下載」資料夾中的臨時檔案。', hint: '打開相簿，從最舊的截圖刪起。' },
        { id: 'T05', category: '數學美學', title: '數學悖論/美學圖形', desc: '上網搜尋一個有趣的數學概念（如 Mandelbrot set 或 Monty Hall 悖論），閱讀或觀看簡介。', hint: '搜尋「有趣數學悖論」。' },
        { id: 'T06', category: '數學美學', title: '數字邏輯微解謎', desc: '完成一局 9x9 中等難度數獨，或解出一道短篇邏輯推理題。', hint: '打開數獨 App 填入第一個確定數字。' },
        { id: 'T07', category: '音樂體驗', title: '盲盒樂曲細聽', desc: '盲選一首從未聽過的古典樂或電影配樂，戴上耳機專注聽完，記錄最吸引你的樂器或和弦。', hint: '按下隨機播放並閉上眼睛。' },
        { id: 'T08', category: '音樂體驗', title: '歌單純化運動', desc: '打開常用音樂 App，清理掉 5 首歌，並將近期最喜愛的 3 首歌加入專屬精選輯。', hint: '打開播放歷史紀錄。' },
        { id: 'T09', category: '人格分析', title: '認知功能微察覺', desc: '記錄自己今天最常使用的 MBTI 認知功能（如 Ti 邏輯、Ne 奇想），寫下 30 字感想。', hint: '在備忘錄寫下「今日主要功能：」。' },
        { id: 'T10', category: '人格分析', title: '九型/MBTI 防衛機制', desc: '翻閱你人格類型的深層解析，重點閱讀該類型的「壓力反應」或「成長方向」。', hint: '搜尋「你的 MBTI 類型 + 成長建議」。' },
        { id: 'T11', category: '身心復位', title: '肩頸深層拉筋', desc: '播放慢步調背景音，進行 10 分鐘深度肩頸伸展與 4-7-8 呼吸。', hint: '離開椅子，將雙手伸向天花板。' },
        { id: 'T12', category: '家居角落', title: '玄關/鞋櫃門面維護', desc: '將擺放凌亂的鞋子排列整齊，並把玄關地面快速掃除一遍。', hint: '將最靠近門口的一雙鞋放回鞋架。' }
      ],
      rewards: [
        { id: 'R01', category: '味覺享受', title: '特調飲品儀式', desc: '給自己沖一杯熱可可、抹茶拿鐵，或加滿冰塊特調檸檬氣泡水。', focus: '專心品嚐第一口的溫度與氣泡感。' },
        { id: 'R02', category: '味覺享受', title: '精緻小食賞味', desc: '享用 1-2 塊平時捨不得一次吃完的高級黑巧克力或精緻餅乾。', focus: '讓巧克力在舌尖慢慢融化。' },
        { id: 'R03', category: '感官放鬆', title: '五感沉浸微放鬆', desc: '點燃香氛蠟燭或噴撒喜歡的香水，躺在沙發上完整聽一首最愛的單曲。', focus: '關掉大燈，只留微光或燭光。' },
        { id: 'R04', category: '感官放鬆', title: '環境白噪音空轉', desc: '戴上耳機，播放 15 分鐘高音質環境音（如深夜營火、老圖書館雨聲），單純發呆。', focus: '不滑手機，讓大腦自由漂浮。' },
        { id: 'R05', category: '智力探索', title: '優質科普短片', desc: '觀看一段 3Blue1Brown 或 Veritasium 的 5-10 分鐘精采動畫解析影片。', focus: '享受純粹獲取美妙知識的愉悅。' },
        { id: 'R06', category: '智力探索', title: '樂曲背後故事漫遊', desc: '搜尋一首你最愛的歌曲之創作背景、樂器編排細節或和弦進行分析。', focus: '用全新角度重新聆聽該曲目。' },
        { id: 'R07', category: '自我共鳴', title: '人格梗圖/論壇漫遊', desc: '瀏覽 10 分鐘關於你人格類型的迷因梗圖 (Memes) 或 Reddit/MBTI 板塊。', focus: '體驗「被精準理解」的幽默與共鳴。' },
        { id: 'R08', category: '身心舒緩', title: '溫熱眼罩護理', desc: '戴上蒸氣眼罩或敷上熱毛巾，躺平靜養 10-15 分鐘。', focus: '徹底釋放眼睛與頭部的緊繃感。' },
        { id: 'R09', category: '視覺探索', title: '微觀視野捕捉', desc: '走到陽台或窗邊，用手機相機拍下一張微觀光影（如葉脈、雲朵層次、建築幾何）。', focus: '尋找日常中被忽略的幾何圖形。' },
        { id: 'R10', category: '身心舒緩', title: '無罪惡感徹底躺平', desc: '直接躺在床上或地毯上，不定鬧鐘、不設定目標，放空 10-15 分鐘。', focus: '告訴自己：「這是已完成任務的合法休息」。' }
      ]
    };

    let appData = JSON.parse(localStorage.getItem('habitCardsApp')) || defaultData;

    function saveData() {
      localStorage.setItem('habitCardsApp', JSON.stringify(appData));
      renderManageView();
    }

    function switchTab(tab) {
      ['draw', 'manage', 'port'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-${t}-btn`);
        btn.classList.remove('text-indigo-600');
        btn.classList.add('text-slate-400');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tab}-btn`);
      activeBtn.classList.add('text-indigo-600');
      activeBtn.classList.remove('text-slate-400');

      if (tab === 'manage') renderManageView();
    }

    function drawRandomCards() {
      if (!appData.tasks.length || !appData.rewards.length) {
        alert('請先在管理頁面新增卡片！');
        return;
      }
      const randomTask = appData.tasks[Math.floor(Math.random() * appData.tasks.length)];
      const randomReward = appData.rewards[Math.floor(Math.random() * appData.rewards.length)];

      document.getElementById('draw-task-cat').innerText = randomTask.category || '任務卡';
      document.getElementById('draw-task-title').innerText = randomTask.title;
      document.getElementById('draw-task-desc').innerText = randomTask.desc;
      document.getElementById('draw-task-hint').innerText = randomTask.hint || '直接開始執行';

      document.getElementById('draw-reward-cat').innerText = randomReward.category || '獎勵卡';
      document.getElementById('draw-reward-title').innerText = randomReward.title;
      document.getElementById('draw-reward-desc').innerText = randomReward.desc;
      document.getElementById('draw-reward-focus').innerText = randomReward.focus || '享受這一刻';
    }

    function renderManageView() {
      document.getElementById('task-count').innerText = appData.tasks.length;
      document.getElementById('reward-count').innerText = appData.rewards.length;

      document.getElementById('tasks-grid').innerHTML = appData.tasks.map((t, i) => `
        <div class="bg-white p-3.5 rounded-xl border border-slate-200 space-y-2">
          <div class="flex justify-between items-center gap-2">
            <input type="text" value="${t.category}" onchange="updateCard('tasks', ${i}, 'category', this.value)" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded w-1/2 border-none">
            <button onclick="deleteCard('tasks', ${i})" class="text-rose-500 text-xs px-2 py-1">刪除</button>
          </div>
          <input type="text" value="${t.title}" onchange="updateCard('tasks', ${i}, 'title', this.value)" class="font-bold text-slate-800 w-full text-base border-b border-slate-100 pb-1">
          <textarea onchange="updateCard('tasks', ${i}, 'desc', this.value)" class="text-xs text-slate-600 w-full h-14 border border-slate-200 rounded p-1.5 text-base sm:text-xs">${t.desc}</textarea>
          <div class="text-xs text-indigo-900 bg-indigo-50/50 p-1.5 rounded">
            <span class="font-semibold text-indigo-600">提示:</span> 
            <input type="text" value="${t.hint || ''}" onchange="updateCard('tasks', ${i}, 'hint', this.value)" class="bg-transparent w-full text-base sm:text-xs">
          </div>
        </div>
      `).join('');

      document.getElementById('rewards-grid').innerHTML = appData.rewards.map((r, i) => `
        <div class="bg-white p-3.5 rounded-xl border border-slate-200 space-y-2">
          <div class="flex justify-between items-center gap-2">
            <input type="text" value="${r.category}" onchange="updateCard('rewards', ${i}, 'category', this.value)" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded w-1/2 border-none">
            <button onclick="deleteCard('rewards', ${i})" class="text-rose-500 text-xs px-2 py-1">刪除</button>
          </div>
          <input type="text" value="${r.title}" onchange="updateCard('rewards', ${i}, 'title', this.value)" class="font-bold text-slate-800 w-full text-base border-b border-slate-100 pb-1">
          <textarea onchange="updateCard('rewards', ${i}, 'desc', this.value)" class="text-xs text-slate-600 w-full h-14 border border-slate-200 rounded p-1.5 text-base sm:text-xs">${r.desc}</textarea>
          <div class="text-xs text-emerald-900 bg-emerald-50/50 p-1.5 rounded">
            <span class="font-semibold text-emerald-600">重點:</span> 
            <input type="text" value="${r.focus || ''}" onchange="updateCard('rewards', ${i}, 'focus', this.value)" class="bg-transparent w-full text-base sm:text-xs">
          </div>
        </div>
      `).join('');
    }

    function updateCard(type, index, key, value) {
      appData[type][index][key] = value;
      saveData();
    }

    function addNewCard(type) {
      const isTask = type === 'tasks';
      const newId = (isTask ? 'T' : 'R') + String(appData[type].length + 1).padStart(2, '0');
      appData[type].push(isTask 
        ? { id: newId, category: '自訂', title: '新任務', desc: '輸入內容...', hint: '啟動提示...' }
        : { id: newId, category: '自訂', title: '新獎勵', desc: '輸入內容...', focus: '體驗重點...' }
      );
      saveData();
    }

    function deleteCard(type, index) {
      if (confirm('確定刪除這張卡片？')) {
        appData[type].splice(index, 1);
        saveData();
      }
    }

    function exportJSON() {
      navigator.clipboard.writeText(JSON.stringify(appData, null, 2));
      alert('已複製 JSON 至剪貼簿！');
    }

    function exportMarkdown() {
      let md = `## 任務卡庫\n| 編號 | 類別 | 任務名稱 | 10-15分鐘執行內容 | 最小啟動提示 |\n| :--- | :--- | :--- | :--- | :--- |\n`;
      appData.tasks.forEach(t => { md += `| **${t.id}** | ${t.category} | **${t.title}** | ${t.desc} | ${t.hint || ''} |\n`; });
      md += `\n## 獎勵卡庫\n| 編號 | 類別 | 獎勵名稱 | 即時獎勵內容 | 體驗重點 |\n| :--- | :--- | :--- | :--- | :--- |\n`;
      appData.rewards.forEach(r => { md += `| **${r.id}** | ${r.category} | **${r.title}** | ${r.desc} | ${r.focus || ''} |\n`; });
      navigator.clipboard.writeText(md);
      alert('已複製 Markdown 表格至剪貼簿！');
    }

    function importJSON() {
      const input = document.getElementById('import-textarea').value.trim();
      if (!input) return alert('請先貼入資料！');
      try {
        const parsed = JSON.parse(input);
        if (parsed.tasks && parsed.rewards) {
          appData = parsed;
          saveData();
          alert('匯入成功！');
          document.getElementById('import-textarea').value = '';
          switchTab('draw');
          drawRandomCards();
        }
      } catch (e) {
        alert('格式不正確！');
      }
    }

    function resetDefaultData() {
      if (confirm('確定恢復預設卡片？')) {
        appData = JSON.parse(JSON.stringify(defaultData));
        saveData();
        drawRandomCards();
        alert('已恢復預設！');
      }
    }

    // 頁面載入後自動抽卡
    window.onload = function() {
      drawRandomCards();
    };
  // 頁面載入時自動讀取上次儲存的 JSON
  window.addEventListener('DOMContentLoaded', () => {
    const savedData = localStorage.getItem('my_app_json');
    const textArea = document.querySelector('textarea');
    if (savedData && textArea) {
      textArea.value = savedData;
      // 自動模擬點擊匯入按鈕
      const importBtn = document.querySelector('button');
      if (importBtn) importBtn.click();
    }
  });

  // 當你在文字框貼入 JSON 時自動寫入手機記憶體
  document.addEventListener('input', (e) => {
    if (e.target.tagName === 'TEXTAREA') {
      localStorage.setItem('my_app_json', e.target.value);
    }
  });
</script>
</body>
</html>
